{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot Chat · Register</title>
    <!-- Bootstrap 5 + Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-image: url({% static 'images/dot_chat_background.png' %});
            background-size: cover;
            min-height: 100vh;
        }
                .profile-card {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 2.5rem 2rem;
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        </style>
</head>
<body>
        <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="profile-card">
            <div>
           <h1>
           <img src="{% static 'images/' %}{{ user.profile_pic }}" alt="Profile picture" class="card-img-top" style="width: 150px; height: 150px; border-radius: 50%;">
{{ user.username }}</h1>
            </div>
            <p>{{user.bio}}</p>
            <h1>Friend: {{ friend_ids|length }}</h1>
            <div>
                {% if friend_status == 'self' %}
                        <a href="/#">
                            <button class="btn" style="background: black; color: white;">Edit Profile</button>
                        </a>
                {% elif friend_status == 'friend' %}
                        <a href="{% url 'message_page' receiver_id=user.id %}">
                            <button class="btn" style="background: black; color: white;">Send Message</button>
                        </a>
                                                <a href="{% url 'delete_friend' receiver_id=user.id %}" style="text-decoration: none;">
                            <button class="btn" style="background: red; color: white;">
                                <i class="fas fa-user-minus me-2"></i>
                            </button>
                        </a>
                {% elif friend_status == 'pending_sent' %}
                    <div id="requestbutton">
                        <button class="btn btn-dark" disabled>Request Sent</button>
                        <a href="{% url 'cancel_friend_request' receiver_id=user.id %}">
                            <button class="btn" style="background: black; color: white;">Cancel</button>
                            </a>
                        </div>
                    {% elif friend_status == 'pending_received' %}
                        <a href="{% url 'add_friend' receiver_id=user.id %}">
                            <button class="btn" style="background: #214ec1; color: white;">Accept Request</button>
                        </a>
                    {% else %}
                        <a href="{% url 'add_friend' receiver_id=user.id %}">
                            <button class="btn" style="background: black; color: white;">Add Friend</button>
                        </a>
                    {% endif %}

                </div>
            </div>
            
    </div>

</body>
</html>
