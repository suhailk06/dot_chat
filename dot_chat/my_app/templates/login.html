{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot Chat · Register</title>
    <!-- Bootstrap 5 + Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-image: url({% static 'images/dot_chat_background.png' %});
            background-size: cover;
            min-height: 100vh;
        }
                .login-card {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 50px rgba(180, 20, 30, 0.3);
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        </style>
</head>
<body>
        <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="login-card">
    <h2>Login</h2>
    
{% if messages %}
    {% for message in messages %}
        <script>
            alert("{{ message }}");
        </script>
    {% endfor %}
{% endif %}
    
    <form method="post">
        {% csrf_token %}
        
        <!-- Manual form fields instead of {{ form.as_p }} -->
                <div class="mb-3">
                    <label for="id_username" class="form-label">
                        <i class="fas fa-user me-2"></i>Username
                    </label><br>
            <input type="text" name="username" id="username" required>
        </div>
        
                <div class="mb-3">
                    <label for="id_password1" class="form-label">
                        <i class="fas fa-lock me-2"></i>Password
                    </label><br>
            <input type="password" name="password" id="password" required>
        </div>

        <button type="submit" class="btn btn-dark">Login</button>
                    <p>Don't have an account? <a href="{% url 'register' %}" style="color: #ffffff; text-decoration: underline;">Register here</a></p>
    </form>

            </div>
    </div>

</body>
</html>
